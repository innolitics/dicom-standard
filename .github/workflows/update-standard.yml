name: update-standard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

env:
  PYTHON_VERSION: '3.12'
  DICOM_VERSION: 'current'

jobs:
  make:
    name: Run make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Makefile (DICOM version ${{ env.DICOM_VERSION }})
        run: |
          make clean
          make updatestandard VERSION='${{ env.DICOM_VERSION }}'
          make -j
        working-directory: dicom_standard
      - name: Upload JSON files
        uses: actions/upload-artifact@v4
        with:
          name: new_standard
          path: dicom_standard/dist/*
  test-and-open-pr:
    needs: make
    name: Run tox and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tox
          pip install -r requirements.txt
      - name: Download updated standard
        uses: actions/download-artifact@v4
        with:
          name: new_standard
          path: new_standard/
      - name: Diff JSON files
        run: echo "diff_lines=$(diff -qr standard new_standard | grep -v '.gitignore' | wc -l)" >> $GITHUB_OUTPUT
        id: diff_files
      - name: Update standard
        run: |
          mv new_standard/*.json standard
          rm -rf new_standard
        if: steps.diff_files.outputs.diff_lines > 0
      - name: Run tests
        run: tox
      # Publish via a pull request rather than by committing straight to master, so
      # regenerated data is reviewed before it lands. Runs only after tox has passed.
      - name: Open pull request
        if: steps.diff_files.outputs.diff_lines > 0
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: update-standard/${{ env.DICOM_VERSION }}
          delete-branch: true
          add-paths: standard/*.json
          commit-message: 'Update standard to latest published revision'
          title: 'Update standard (DICOM ${{ env.DICOM_VERSION }})'
          body: |
            Automated regeneration of `standard/*.json` from the current published
            DICOM Standard, opened by the `update-standard` workflow.

            The test suite (`tox`) passed against this data before the pull request
            was created. Review the diff and merge to publish.
